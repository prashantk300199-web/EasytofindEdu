name: Deploy Backend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'EasyToFindEdu-Backend/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EasyToFindEdu-Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'EasyToFindEdu-Backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build 2>&1 || echo "No build step needed"
